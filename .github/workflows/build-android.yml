name: Build Android APK
on:
  push:
    branches: [ master ]
  workflow_dispatch: # 支持手动触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Decode keystore base64
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > capacitor-release.keystore

      - name: Expo prebuild generate android project
        run: npx expo prebuild --platform android

      - name: Inject release signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'
android {
    signingConfigs {
        release {
            storeFile file("../../capacitor-release.keystore")
            storePassword "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            keyAlias "${{ secrets.ANDROID_KEY_ALIAS }}"
            keyPassword "${{ secrets.ANDROID_KEY_PASSWORD }}"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
        }
    }
}
EOF
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: substreamer-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
